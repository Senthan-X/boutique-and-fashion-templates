name: Merge legacy Boutique collection
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/merge-legacy-collection.yml'
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge three legacy templates into landing page
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Collection-wide count/copy updates.
          s = s.replace('Five storefront templates, one shared build', 'Eight storefront templates, one shared build')
          s = s.replace('Five storefronts.<br>One shared build.', 'Eight storefronts.<br>One shared build.')
          s = s.replace('<span class="hnum">05</span><span class="hlbl">Templates</span>', '<span class="hnum">08</span><span class="hlbl">Templates</span>')
          s = s.replace('One foundation, five identities', 'One foundation, eight identities')

          # Keep Senthan & Co contact details out of the public template landing page.
          s = re.sub(r'\s*<a href="mailto:[^"]+">Contact</a>\s*', '\n      ', s)

          # Add the original three templates if they are not already present.
          if 'href: "maison-index.html"' not in s:
              marker = '''  {\n    num: "05", key: "secondthread", swatch: "#4A6741",\n    title: "Second Thread", tagline: "Hand-picked vintage, one piece at a time.",\n    tags: ["Vintage & Thrift", "Secondhand", "7 Languages"],\n    href: "secondthread.html"\n  }\n];'''
              replacement = '''  {\n    num: "05", key: "secondthread", swatch: "#4A6741",\n    title: "Second Thread", tagline: "Hand-picked vintage, one piece at a time.",\n    tags: ["Vintage & Thrift", "Secondhand", "7 Languages"],\n    href: "secondthread.html"\n  },\n  {\n    num: "06", key: "maison", swatch: "#B7A58A",\n    title: "Maison", tagline: "Editorial fashion commerce with a magazine-led identity.",\n    tags: ["Editorial Fashion", "Heavy Catalog", "7 Languages"],\n    href: "maison-index.html"\n  },\n  {\n    num: "07", key: "atelier", swatch: "#4D4A45",\n    title: "Atelier", tagline: "A refined luxury direction built around product and studio imagery.",\n    tags: ["Luxury Atelier", "Studio Editorial", "7 Languages"],\n    href: "atelier-index.html"\n  },\n  {\n    num: "08", key: "eclat", swatch: "#8A8176",\n    title: "ÉCLAT", tagline: "Contemporary fashion presentation with a catalogue-first approach.",\n    tags: ["Contemporary Fashion", "Catalog-First", "7 Languages"],\n    href: "eclat-index.html"\n  }\n];'''
              if marker not in s:
                  raise SystemExit('Expected ENTRIES marker not found; refusing unsafe edit')
              s = s.replace(marker, replacement)

          # Render a deliberate placeholder when a preview image is not available yet.
          old = '''      + '<div class="entry-visual"><img src="'+imgSrc(e.key)+'" alt="'+e.title+' preview" loading="lazy"></div>'\n'''
          new = '''      + (imgSrc(e.key) ? '<div class="entry-visual"><img src="'+imgSrc(e.key)+'" alt="'+e.title+' preview" loading="lazy"></div>' : '<div class="entry-visual" style="background:linear-gradient(135deg,'+e.swatch+'33,var(--surface));display:grid;place-items:center;"><span class="eyebrow">Preview coming next</span></div>')\n'''
          if old in s:
              s = s.replace(old, new)

          p.write_text(s, encoding='utf-8')
      - name: Commit merged landing page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/merge-legacy-collection.yml
          git commit -m "Merge Maison Atelier and ECLAT into Boutique collection"
          git push